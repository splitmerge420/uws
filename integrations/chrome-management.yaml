name: chrome-management
description: Chrome Browser Cloud Management and Chrome Policy API for enterprise device and policy management
version: "1.0"

scopes:
  - "https://www.googleapis.com/auth/chrome.management.policy"
  - "https://www.googleapis.com/auth/chrome.management.reports.readonly"

data_handling_class: CLASS_B

constitutional_invariants:
  - INV-001   # User Sovereignty
  - INV-002   # Consent Gating
  - INV-003   # Audit Trail
  - INV-004   # Data Classification
  - INV-006   # Provider Abstraction
  - INV-011   # Encryption at Rest
  - INV-012   # Encryption in Transit
  - INV-016   # Data Minimization
  - INV-019   # Jurisdictional Compliance
  - INV-020   # No Silent Sharing

fallback_providers: []

third_party_sharing: false

jurisdictions:
  - GDPR
  - CCPA
