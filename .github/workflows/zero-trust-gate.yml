name: Zero Trust Integration Gate

on:
  push:
    branches: [main]
    paths:
      - 'integrations/**'
      - 'toolchain/zero_trust_gate.py'
      - 'toolchain/invariants_registry.py'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    name: Zero Trust Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate all integration manifests
        run: |
          python toolchain/zero_trust_gate.py --json | tee /tmp/gate-report.json
          # Re-run without --json for human-readable output in the log
          python toolchain/zero_trust_gate.py

      - name: Annotate failures
        if: failure()
        run: |
          python - <<'EOF'
          import json, sys
          with open("/tmp/gate-report.json") as f:
              report = json.load(f)
          for result in report.get("results", []):
              if not result["passed"]:
                  for err in result.get("errors", []):
                      print(f"::error file={result['path']},title=Zero Trust Gate [{err['code']}]::{err['message']}")
          EOF

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-trust-gate-report
          path: /tmp/gate-report.json
          retention-days: 7
