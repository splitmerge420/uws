[package]
name = "uws"
version = "0.1.0"
edition = "2021"
authors = ["Dave Sheldon <splitmerge420@gmail.com>"]
description = "Universal Workspace CLI — Constitutional operating system for AI-augmented life"
license = "MIT"
repository = "https://github.com/splitmerge420/uws"
readme = "README.md"

[lib]
name = "uws"
path = "src/lib.rs"

[[bin]]
name = "uws"
path = "src/main.rs"

[features]
default = ["std"]
std = []

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.102"
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = "0.4.44"
clap = { version = "4.3", features = ["derive", "string"] }
crossterm = "0.29.0"
derive_builder = "0.20.2"
dirs = "6.0.0"
dotenvy = "0.15.7"
futures-util = "0.3.32"
keyring = "3.6.3"
percent-encoding = "2.3.2"
rand = "0.8"
ratatui = "0.30.0"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
yup-oauth2 = "12.1.2"

[dev-dependencies]
serial_test = "3.4.0"
tempfile = "3.27.0"
# Tests use only std for now

[profile.release]
opt-level = 3
lto = true
strip = true
