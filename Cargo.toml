[package]
name = "uws"
version = "0.1.0"
edition = "2021"
authors = ["Dave Sheldon <splitmerge420@gmail.com>"]
description = "Universal Workspace CLI — Constitutional operating system for AI-augmented life"
license = "MIT"
repository = "https://github.com/atlaslattice/uws"
readme = "README.md"

[lib]
name = "uws"
path = "src/lib.rs"

[[bin]]
name = "uws"
path = "src/main.rs"

[features]
default = ["std"]
# Wire dep:serde into the std feature so constitutional_engine.rs can use
# serde's derive macros under #[cfg(feature = "std")].
std = ["dep:serde"]

[dependencies]
# constitutional_engine.rs uses serde behind cfg(feature = "std")
serde = { version = "1", features = ["derive"], optional = true }

# CLI argument parsing (regen_ip subcommand tree)
clap = { version = "4", features = ["derive", "string"] }

# JSON output (regen_ip records, error module)
serde_json = "1"

# Error handling (error.rs GwsError)
anyhow = "1"
thiserror = "1"

# SHA-256 hashing for artifact provenance (regen_ip)
sha2 = "0.10"

# Phase 2 (uncomment when full provider dispatch is stable):
# tokio      = { version = "1", features = ["full"] }
# dotenvy    = "0.15"
# reqwest    = { version = "0.12", features = ["json", "stream"] }
# futures-util = "0.3"
# percent-encoding = "2"
# yup-oauth2 = "6"
# async-trait = "0.1"
# aes-gcm    = "0.10"
# rand       = "0.8"
# keyring    = "2"
# base64     = "0.22"
# serde_yaml = "0.9"
# ratatui    = "0.30"
# crossterm  = "0.29"
# chrono     = { version = "0.4", features = ["serde"] }
# derive_builder = "0.20"
# dirs       = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
