[package]
name = "uws"
version = "0.1.0"
edition = "2021"
authors = ["Dave Sheldon <splitmerge420@gmail.com>"]
description = "Universal Workspace CLI — Constitutional operating system for AI-augmented life"
license = "MIT"
repository = "https://github.com/splitmerge420/uws"
readme = "README.md"

[lib]
name = "uws"
path = "src/lib.rs"

[[bin]]
name = "uws"
path = "src/main.rs"

[features]
default = ["std"]
std = ["dep:serde"]

[dependencies]
# Core serialisation — gated on "std" feature so the lib stays no_std-capable
serde = { version = "1", features = ["derive"], optional = true }

# CLI framework
clap = { version = "4", features = ["derive", "string"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

# Data formats
serde_json = "1"
serde_yaml = "0.9"

# Error handling
anyhow = "1"
thiserror = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Crypto / encoding
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"

# OS / filesystem
dirs = "5"
dotenvy = "0.15"

# URL encoding
percent-encoding = "2"

# Terminal UI
ratatui = "0.29"
crossterm = "0.28"

# Async utilities
async-trait = "0.1"
futures-util = "0.3"

# Builder macros
derive_builder = "0.20"

# OS credential store
keyring = "3"

# Google OAuth2
yup-oauth2 = "11"

[dev-dependencies]
tempfile = "3"
serial_test = "3"

[profile.release]
opt-level = 3
lto = true
strip = true